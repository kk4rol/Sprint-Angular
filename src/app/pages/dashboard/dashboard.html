<app-menu></app-menu>

<main>

        <h2>Dashboard FORD</h2>

        <div class="cards">
            <div class="card">
                <div class="titulo">
                    <span>Veículo</span> 
                </div> <br>
                
                <select name="veiculo" id="" (change)="veiculoSelecionado($event)">
                    <option value="" hidden selected disabled>Escolha um modelo</option>
                    <option *ngFor="let v of vehicles" [value]="v.id">
                        {{v.vehicle}}
                    </option>
                </select>
            </div>

            <div class="card">
                <div class="titulo">
                    <span>Total de Vendas</span>
                </div>
                <span class="cardInfo">{{ selecionado?.volumetotal }}</span> 
                <span class="unid">Unid.</span>   
            </div>

            <div class="card">
                <div class="titulo">
                    <span>Conectados</span>
                </div>
                <span class="cardInfo">{{ selecionado?.connected }}</span>
                <span class="unid">Unid.</span>
            </div>

            <div class="card">
                <div class="titulo">
                    <span>Update Software</span>
                </div>
                <span class="cardInfo">{{ selecionado?.softwareUpdates }}</span>
                <span class="unid">Unid.</span>
            </div> 
        </div>


        <div class="imagemCarro">
            <img *ngIf="selecionado" [src]="selecionado.img" [alt]="selecionado.vehicle">
        </div>



            <table>
                <tr>
                    <th style="width: 20%;">Código - Vin</th>
                    <th style="width: 15%;">Odômetro</th>
                    <th style="width: 18%;">Nível de Combustível</th>
                    <th style="width: 10%;">Status</th>
                    <th style="width: 16%;">Lat.</th>
                    <th style="width: 16%;">Long.</th>
                </tr>
                <tr style="height: 70px; padding-left: 10px;">
                    <td style="display: flex; justify-content: center; align-items: center; gap: 5px;">
                        <input type="text" name="codigo"> 
                        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </td>
                    <!-- <td *ngFor="let s of veiculosInfo">{{s.odometro}}</td> -->
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr style="background-color: #00095b; height: 30px;">
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
    </main>
